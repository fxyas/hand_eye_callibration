aruco_goal_publisher:
  ros__parameters:

    camera:
      image_topic: /zed/zed_node/left/color/rect/image
      camera_info_topic: /zed/zed_node/left/color/rect/camera_info
      frame: camera_link # The TF frame of the camera (must match the static TF publisher)

    display:
      show_image: true

    robot:
      base_frame: base_link # The TF frame the goal pose is published in

    target:
      type: aruco
      marker_size: 0.05 # meters
      dictionary: DICT_5X5_50
      marker_id: -1 # specific marker ID to track, -1 for any

    goal:
      topic: /goal_pose
      rate_hz: 10.0
